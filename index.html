<style>
  :root {
    --bg: #ffffff;
    --panel: #ffe3ee;
    --line: #f3b6d0;
    --text: #4a2335;
    --muted: #9a5f7a;
    --yes: #0f8a6f;
    --no: #d93a63;
    --accent: #f2679f;
    --on-accent: #4a1f33;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: linear-gradient(120deg, #ffffff, #ffeef5, #ffffff, #ffe6f0, #ffffff);
    background-size: 300% 300%;
    animation: bgflow 16s ease-in-out infinite;
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  header, main { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 40px; padding-bottom: 8px; }
  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 4px; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #fff7fb, #ffb3d1, #f2679f, #ffb3d1, #fff7fb, #ffb3d1, #f2679f);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 2px rgba(242,103,159,.55)) drop-shadow(0 3px 6px rgba(242,103,159,.3));
    animation: flow 6s linear infinite;
  }
  @keyframes bgflow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes flow { to { background-position: -300% 0; } }
  @media (prefers-reduced-motion: reduce) { h1, body { animation: none; } }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: clamp(72px, 18vw, 112px); height: auto; border-radius: 16px; flex: none; }
  header p { margin: 0; color: var(--muted); max-width: 52ch; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 18px; }
  input[type=search], input[type=text], input[type=url], textarea, select {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    width: 100%;
  }
  .controls input[type=search] { flex: 1 1 240px; width: auto; }
  input:focus-visible, textarea:focus-visible, select:focus-visible,
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chip {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; font: inherit; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }

  #list { display: grid; gap: 12px; }
  .mod {
    background: var(--panel);
    border: 1px solid var(--line);
        border-radius: 10px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 16px;
    align-items: start;
  }
  .mod h2 { margin: 0; font-size: 1.15rem; }
  .status { font-weight: 700; font-size: .9rem; color: var(--no); }
  .ok .status { color: var(--yes); }
  .mod p { grid-column: 1 / -1; margin: 0; color: var(--muted); }
  .dl {
    grid-column: 1 / -1; justify-self: start;
    background: var(--accent); color: var(--on-accent); text-decoration: none;
    font-weight: 700; border-radius: 8px; padding: 9px 16px;
  }
  .dl[aria-disabled="true"] { background: var(--line); color: var(--muted); pointer-events: none; }
  .empty { color: var(--muted); padding: 24px 0; }

  details { margin: 32px 0 60px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
  summary { cursor: pointer; font-weight: 700; }
  form { display: grid; gap: 12px; margin-top: 14px; }
  label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  .save { justify-self: start; background: var(--yes); color: #ffffff; border: 0; border-radius: 8px; padding: 10px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  .err { color: var(--no); margin: 0; min-height: 1.2em; }
</style>
</head>

  <div>
    <h1>MEOW•WARE</h1>
    <p>Browse mods, check whether they currently work, and grab the download link.</p>
  </div>
</header>

<main>
  <div class="controls">
    <input type="search" id="q" placeholder="Search mods" aria-label="Search mods">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="true" aria-pressed="false">Working</button>
    <button class="chip" data-f="false" aria-pressed="false">Not working</button>
  </div>

  <div id="list" aria-live="polite"></div>

  <details>
    <summary>Add a mod</summary>
    <form id="add">
      <label>Name <input type="text" id="n" required></label>
      <label>WORKING?
        <select id="w"><option value="true">true</option><option value="false">false</option></select>
      </label>
      <label>DESCRIPTION <textarea id="d" rows="3" required></textarea></label>
      <label>DOWNLOAD LINK <input type="url" id="l" placeholder="https://" required></label>
      <label>Upload password <input type="password" id="pw" autocomplete="off" required></label>
      <p class="err" id="err"></p>
      <button class="save" type="submit">Add mod</button>
    </form>
  </details>
</main>

<script>
  // Edit this array to manage the store. Each mod has:
  // WORKING? (true/false), DESCRIPTION, DOWNLOAD LINK
  const mods = [];

function sha256(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), i, j, result = '';
  var words = [], asciiBitLength = ascii.length * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k.length;
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = asciiBitLength;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
    var b = (hash[i] >> (j * 8)) & 255;
    result += (b < 16 ? 0 : '') + b.toString(16);
  }
  return result;
}

  const PASSWORD_HASH = "709e0a383ecf7ce7a261a61c51b2c4770d28c392aece4fc65953fcc2ad53759e";
  let filter = "all";
  const list = document.getElementById("list");
  const q = document.getElementById("q");

  function safeUrl(u) {
    try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; }
    catch (e) { return ""; }
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    list.textContent = "";
    const shown = mods.filter(m =>
      (filter === "all" || String(m.working) === filter) &&
      (m.name + " " + m.description).toLowerCase().includes(term));

    if (!shown.length) {
      const e = document.createElement("p");
      e.className = "empty";
      e.textContent = "No mods yet. Add one with the form below, or adjust your search or filter.";
      list.appendChild(e);
      return;
    }

    shown.forEach(m => {
      const card = document.createElement("article");
      card.className = "mod" + (m.working ? " ok" : "");

      const h = document.createElement("h2"); h.textContent = m.name;
      const s = document.createElement("span"); s.className = "status";
      s.textContent = "WORKING?: " + m.working;
      const p = document.createElement("p"); p.textContent = m.description;

      const a = document.createElement("a"); a.className = "dl";
      const href = safeUrl(m.link);
      a.textContent = "Download";
      if (href) { a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      else { a.setAttribute("aria-disabled", "true"); }

      card.append(h, s, p, a);
      list.appendChild(card);
    });
  }

  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));
  q.addEventListener("input", render);

  document.getElementById("add").addEventListener("submit", e => {
    e.preventDefault();
    const link = document.getElementById("l").value.trim();
    const err = document.getElementById("err");
    if (sha256("meowware|" + document.getElementById("pw").value) !== PASSWORD_HASH) { err.textContent = "Wrong password. Mod not added."; return; }
    if (!safeUrl(link)) { err.textContent = "Enter a link that starts with http:// or https://."; return; }
    err.textContent = "";
    mods.unshift({
      name: document.getElementById("n").value.trim(),
      working: document.getElementById("w").value === "true",
      description: document.getElementById("d").value.trim(),
      link
    });
    e.target.reset();
    render();
  });

  render();
</script>
</body>
</html>

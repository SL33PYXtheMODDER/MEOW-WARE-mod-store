<style>
  :root {
    --rail: #f6b3d0;
    --side: #ffd9e8;
    --panel: #ffe3ee;
    --line: #f3b6d0;
    --text: #4a2335;
    --muted: #9a5f7a;
    --yes: #0f8a6f;
    --no: #d93a63;
    --accent: #f2679f;
    --on-accent: #4a1f33;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    line-height: 1.5;
    background: #fff;
  }
  button, input, textarea, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    display: grid;
    grid-template-columns: 72px 240px 1fr;
    height: 100vh; height: 100dvh;
  }
  .app > * { min-height: 0; }

  /* server rail */
  .rail {
    background-color: var(--rail);
    background-image: linear-gradient(180deg, #f6b3d0, #ff9cc6, #ffd0e3, #ff9cc6, #f6b3d0);
    background-size: 100% 300%; animation: bgflowY 14s ease-in-out infinite;
    display: flex; flex-direction: column; align-items: center; padding: 12px 0; }
  .rail img { width: 48px; height: 48px; border-radius: 16px; display: block; }

  /* channel sidebar */
  .side {
    background-color: var(--side);
    background-image: linear-gradient(180deg, #ffe3ee, #ffc4dc, #fff0f6, #ffc4dc, #ffe3ee);
    background-size: 100% 300%; animation: bgflowY 14s ease-in-out infinite;
    display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow-y: auto; }
  .server {
    display: flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .server .mini { display: none; width: 30px; height: 30px; border-radius: 9px; }
  .server-name {
    margin: 0; font-size: 1.2rem; letter-spacing: -0.01em;
    background: linear-gradient(90deg, #fff7fb, #ffb3d1, #f2679f, #ffb3d1, #fff7fb, #ffb3d1, #f2679f);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 2px rgba(242,103,159,.55)) drop-shadow(0 2px 4px rgba(242,103,159,.3));
    animation: flow 6s linear infinite;
  }
  @keyframes flow { to { background-position: -300% 0; } }
  nav { padding: 12px 8px; }
  .group { margin: 12px 8px 4px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .group:first-child { margin-top: 0; }
  .ch {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: transparent; border: 0; border-radius: 6px;
    padding: 8px 10px; color: var(--muted); cursor: pointer; text-align: left;
  }
  .ch .count { margin-left: auto; font-size: .8rem; }
  .ch:hover { background: rgba(255,255,255,.55); color: var(--text); }
  .ch[aria-current="page"] { background: rgba(255,255,255,.9); color: var(--text); font-weight: 700; }

  .join {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    background: linear-gradient(90deg, #fff7fb, #ffb3d1, #f2679f, #ffb3d1, #fff7fb, #ffb3d1, #f2679f);
    background-size: 300% 100%;
    animation: flow 6s linear infinite;
    color: var(--on-accent); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px;
    box-shadow: 0 2px 8px rgba(242,103,159,.3);
  }
  .join:hover { box-shadow: 0 2px 12px rgba(242,103,159,.55); }
  .join-side { margin: auto 12px 12px; }
  .join-top { display: none; margin-left: auto; padding: 6px 12px; font-size: .9rem; white-space: nowrap; }

  /* main */
  .main {
    display: flex; flex-direction: column; min-width: 0;
    background-image: linear-gradient(120deg, #ffffff, #ffd6e8, #ffffff, #ffc2dc, #ffffff);
    background-size: 300% 300%;
    animation: bgflow 16s ease-in-out infinite;
  }
  @keyframes bgflowY { 0%, 100% { background-position: 50% 0%; } 50% { background-position: 50% 100%; } }
  @keyframes bgflow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none;
    background: rgba(255,255,255,.7);
  }
  .top h2 { margin: 0; font-size: 1rem; white-space: nowrap; }
  #q {
    width: min(240px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; color: var(--text);
  }
  .content { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  [hidden] { display: none !important; }

  .feed { display: grid; gap: 12px; }
  .msg, .person {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px;
  }
  .av {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; color: var(--on-accent);
    background: linear-gradient(135deg, #ffb3d1, #f2679f);
  }
  .body { min-width: 0; flex: 1; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .head strong { font-size: 1.05rem; overflow-wrap: anywhere; }
  .status { font-size: .85rem; font-weight: 700; color: var(--no); }
  .status.ok { color: var(--yes); }
  .body p { margin: 4px 0 10px; color: var(--muted); overflow-wrap: anywhere; }
  .person .body p { margin: 0; }
  .dl {
    display: inline-block; background: var(--accent); color: var(--on-accent);
    text-decoration: none; font-weight: 700; border-radius: 8px; padding: 8px 16px;
  }
  .dl[aria-disabled="true"] { background: var(--line); color: var(--muted); pointer-events: none; }
  .star {
    flex: none; background: transparent; border: 0; border-radius: 8px;
    padding: 2px 6px; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--muted);
  }
  .star:hover { color: var(--accent); }
  .star[aria-pressed="true"] { color: var(--accent); }
  .rating { font-size: .85rem; font-weight: 700; color: #b8336a; }
  .reviews { margin-top: 10px; display: grid; gap: 8px; }
  .review { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .review .rh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .review .stars { color: #b8336a; font-weight: 700; }
  .review .when { color: var(--muted); font-size: .8rem; }
  .review p { margin: 4px 0 0; color: var(--text); }
  .rform { padding: 0; border: 0; background: transparent; margin-top: 10px; gap: 8px; }
  .small { padding: 4px 10px; font-size: .85rem; }
  .paws { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; padding: 0 4px; }
  .paws svg { width: 20px; height: 20px; fill: var(--accent); opacity: .85; }
  .paws svg:nth-child(odd) { transform: rotate(-18deg); }
  .paws svg:nth-child(even) { transform: translateY(-6px) rotate(18deg); }
  .paws svg { animation: pawwalk 2.4s ease-in-out infinite; }
  .paws svg:nth-child(2) { animation-delay: .4s; }
  .paws svg:nth-child(3) { animation-delay: .8s; }
  .paws svg:nth-child(4) { animation-delay: 1.2s; }
  @keyframes pawwalk { 0%, 100% { opacity: .2; } 35% { opacity: 1; } 70% { opacity: .2; } }
  .corner-paw {
    position: fixed; right: 16px; bottom: 16px; width: 56px; height: 56px;
    pointer-events: none; z-index: 50;
    filter: drop-shadow(0 2px 5px rgba(242,103,159,.55));
  }
  .corner-paw svg { width: 100%; height: 100%; display: block; }
  .corner-paw svg ellipse, .corner-paw svg circle { fill: url(#pawGrad); stroke: #fff; stroke-width: 0.6; stroke-linejoin: round; }
  .corner-paw.spin { animation: pawspin .7s ease-in-out; }
  @keyframes pawspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .alt {
    background: #fff; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer;
  }
  .alt:disabled { opacity: .6; cursor: default; }
  .pwrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .pwrow input { width: auto; flex: 1 1 140px; max-width: 220px; }
  .empty { color: var(--muted); padding: 24px 0; margin: 0; }

  form { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  input[type=text], input[type=url], input[type=password], textarea, select {
    width: 100%; background: #fff; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 10px 12px;
  }
  .save { justify-self: start; background: var(--yes); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-weight: 700; cursor: pointer; }
  .save:disabled { opacity: .6; cursor: default; }
  .err { color: var(--no); margin: 0; min-height: 1.2em; }
  .intro { color: var(--muted); margin: 0 0 14px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { display: none; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .server { border-bottom: 0; }
    .server .mini { display: block; }
    .join-side { display: none; }
    .join-top { display: block; }
    nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 8px 8px; }
    .group { display: none; }
    .ch { width: auto; white-space: nowrap; flex: none; }
    #q { width: 140px; }
  }
  @media (prefers-reduced-motion: reduce) { .server-name, .main, .join, .side, .rail, .paws svg, .corner-paw.spin { animation: none; } }
</style>
</head>

        <stop offset=".5" stop-color="#f2679f"/>
        <stop offset=".75" stop-color="#ffb3d1"/>
        <stop offset="1" stop-color="#fff7fb"/>
        <animateTransform id="pawFlow" attributeName="gradientTransform" type="translate" from="0 0" to="24 0" dur="4s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
    <ellipse cx="12" cy="16" rx="5.5" ry="4.5"/><circle cx="5.5" cy="10" r="2.2"/><circle cx="9.5" cy="5.8" r="2.2"/><circle cx="14.5" cy="5.8" r="2.2"/><circle cx="18.5" cy="10" r="2.2"/>
  </svg>
</div>

<script>
  // Paste your Supabase Project URL and public (anon / publishable) key between the quotes.
  const SUPABASE_URL = "https://ejkqwpojnotbwlkrisvm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_8LMn1kK2oCuCA2GGnhXcrQ_JYTazRxC";
  const API = SUPABASE_URL.replace(/\/+$/, "");
  const HEADERS = { "apikey": SUPABASE_KEY, "Content-Type": "application/json" };

  let loadFailed = false;
  let sessionPw = "";
  const reviews = [];
  const openReviews = new Set();
  const openForms = new Set();

  // Favorites are saved in this browser only
  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem("meowware-favs") || "[]")); } catch (e) {}
  function saveFavs() {
    try { localStorage.setItem("meowware-favs", JSON.stringify([...favs])); } catch (e) {}
  }

  // Keys that let this browser edit the reviews it posted
  let reviewTokens = {};
  try { reviewTokens = JSON.parse(localStorage.getItem("meowware-review-tokens") || "{}") || {}; } catch (e) {}
  function saveTokens() {
    try { localStorage.setItem("meowware-review-tokens", JSON.stringify(reviewTokens)); } catch (e) {}
  }
  function newToken() {
    const a = new Uint8Array(16);
    crypto.getRandomValues(a);
    return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
  }
  function makeRatingSelect(selected) {
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "Rating");
    [5, 4, 3, 2, 1].forEach(n => {
      const o = document.createElement("option");
      o.value = String(n);
      o.textContent = "\u2605".repeat(n) + "\u2606".repeat(5 - n) + "  (" + n + ")";
      if (n === selected) o.selected = true;
      sel.appendChild(o);
    });
    return sel;
  }
  function makePaws() {
    const box = document.createElement("span");
    box.className = "paws";
    box.setAttribute("aria-hidden", "true");
    const paw = '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5.5" ry="4.5"/><circle cx="5.5" cy="10" r="2.2"/><circle cx="9.5" cy="5.8" r="2.2"/><circle cx="14.5" cy="5.8" r="2.2"/><circle cx="18.5" cy="10" r="2.2"/></svg>';
    box.innerHTML = paw.repeat(4);
    return box;
  }

  // Mods are loaded from your Supabase database (see SUPABASE_URL above).
  const mods = [];

  // Edit this array to change the credits tab.
  const credits = [
    { name: "SL33PYX", role: "Founder of MEOW•WARE" },
    { name: "Slak", role: "Looked cute asf" }
  ];

  const channels = {
    all:     { label: "All mods",    type: "mods", filter: "all" },
    working: { label: "Working",     type: "mods", filter: "true" },
    broken:  { label: "Not working", type: "mods", filter: "false" },
    favorites: { label: "Favorites", type: "mods", filter: "fav" },
    upload:  { label: "Upload",      type: "upload" },
    credits: { label: "Credits",     type: "credits" }
  };
  let current = "all";

  const $ = id => document.getElementById(id);

  function safeUrl(u) {
    try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; }
    catch (e) { return ""; }
  }

  function avatar(name) {
    const a = document.createElement("div");
    a.className = "av";
    a.textContent = (name.trim()[0] || "?").toUpperCase();
    a.setAttribute("aria-hidden", "true");
    return a;
  }

  async function postReview(modId, author, rating, comment) {
    if (!API || !SUPABASE_KEY) return "Not set up yet.";
    const token = newToken();
    try {
      const r = await fetch(API + "/rest/v1/rpc/add_review", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({
          p_mod_id: modId, p_author: author.trim(), p_rating: rating,
          p_comment: comment.trim(), p_token: token
        })
      });
      if (!r.ok) return "Couldn't post your review. Try again.";
      try {
        const id = await r.json();
        if (typeof id === "string") { reviewTokens[id] = token; saveTokens(); }
      } catch (x) {}
      return "ok";
    } catch (x) {
      return "Couldn't reach the server.";
    }
  }

  async function editReview(id, rating, comment) {
    if (!API || !SUPABASE_KEY) return "Not set up yet.";
    try {
      const r = await fetch(API + "/rest/v1/rpc/edit_review", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ p_review_id: id, p_token: reviewTokens[id] || "", p_rating: rating, p_comment: comment.trim() })
      });
      return r.ok ? "ok" : "Couldn't save your changes. You can only edit reviews posted from this browser.";
    } catch (x) {
      return "Couldn't reach the server.";
    }
  }

  async function setWorking(id, working, password) {
    if (!API || !SUPABASE_KEY) return "Not set up yet.";
    try {
      const r = await fetch(API + "/rest/v1/rpc/set_mod_working", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({ p_password: password, p_id: id, p_working: working })
      });
      if (r.ok) return "ok";
      let msg = "";
      try { msg = (await r.json()).message || ""; } catch (x) {}
      return msg.includes("wrong password") ? "Wrong password." : "Couldn't update. Try again.";
    } catch (x) {
      return "Couldn't reach the server.";
    }
  }

  function renderMods(filter) {
    const feed = $("feed");
    feed.textContent = "";
    const term = $("q").value.trim().toLowerCase();
    const shown = mods.filter(m =>
      (filter === "all" || (filter === "fav" ? favs.has(m.id) : String(m.working) === filter)) &&
      (m.name + " " + m.description).toLowerCase().includes(term));

    if (!shown.length) {
      const e = document.createElement("p");
      e.className = "empty";
      e.textContent = loadFailed
        ? "Couldn't load the mods. Refresh the page to try again."
        : filter === "fav" && !term
          ? "No favorites yet. Tap the star on a mod to save it here."
        : mods.length
          ? "No mods match. Clear the search or pick another tab."
          : "No mods yet. Add one in the upload tab.";
      feed.appendChild(e);
      return;
    }

    shown.forEach(m => {
      const card = document.createElement("article");
      card.className = "msg";

      const body = document.createElement("div");
      body.className = "body";

      const head = document.createElement("div");
      head.className = "head";
      const h = document.createElement("strong"); h.textContent = m.name;
      const s = document.createElement("span");
      s.className = "status" + (m.working ? " ok" : "");
      s.textContent = "WORKING?: " + m.working;
      head.append(h, s);

      const p = document.createElement("p"); p.textContent = m.description;

      const a = document.createElement("a");
      a.className = "dl"; a.textContent = "Download";
      const href = safeUrl(m.link);
      if (href) { a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      else { a.setAttribute("aria-disabled", "true"); }

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(a);
      body.append(head, p, actions);

      if (m.id) {
        const t = document.createElement("button");
        t.type = "button"; t.className = "alt";
        t.textContent = m.working ? "Mark as not working" : "Mark as working";

        const box = document.createElement("div");
        box.className = "pwrow"; box.hidden = true;
        const pw = document.createElement("input");
        pw.type = "password"; pw.placeholder = "Password"; pw.autocomplete = "off";
        pw.setAttribute("aria-label", "Password to change status");
        const ok = document.createElement("button");
        ok.type = "button"; ok.className = "alt"; ok.textContent = "Confirm";
        const msg = document.createElement("span");
        msg.className = "err"; msg.setAttribute("role", "alert");
        box.append(pw, ok, msg);

        const run = async password => {
          t.disabled = ok.disabled = true;
          msg.textContent = "";
          const res = await setWorking(m.id, !m.working, password);
          t.disabled = ok.disabled = false;
          if (res === "ok") { sessionPw = password; await loadMods(); }
          else { sessionPw = ""; box.hidden = false; msg.textContent = res; }
        };
        t.addEventListener("click", () => {
          if (sessionPw) run(sessionPw);
          else { box.hidden = !box.hidden; if (!box.hidden) pw.focus(); }
        });
        ok.addEventListener("click", () => run(pw.value));

        actions.append(t);
        body.append(box);
      }

      actions.append(makePaws());

      if (m.id) {
        const rs = reviews.filter(x => x.mod_id === m.id);
        if (rs.length) {
          const avg = rs.reduce((sum, x) => sum + x.rating, 0) / rs.length;
          const rt = document.createElement("span");
          rt.className = "rating";
          rt.textContent = "\u2605 " + avg.toFixed(1) + " (" + rs.length + ")";
          head.append(rt);
        }

        const row = document.createElement("div");
        row.className = "actions"; row.style.marginTop = "8px";
        const vr = document.createElement("button");
        vr.type = "button"; vr.className = "alt";
        vr.textContent = "View reviews (" + rs.length + ")";
        const wr = document.createElement("button");
        wr.type = "button"; wr.className = "alt";
        wr.textContent = "Write a review";
        row.append(vr, wr);

        const list = document.createElement("div");
        list.className = "reviews";
        list.hidden = !openReviews.has(m.id);
        if (!rs.length) {
          const none = document.createElement("p");
          none.textContent = "No reviews yet. Be the first to write one.";
          list.appendChild(none);
        }
        rs.forEach(x => {
          const item = document.createElement("div");
          item.className = "review";
          const rh = document.createElement("div"); rh.className = "rh";
          const au = document.createElement("strong"); au.textContent = x.author;
          const st = document.createElement("span"); st.className = "stars";
          st.textContent = "\u2605".repeat(x.rating) + "\u2606".repeat(5 - x.rating);
          const wh = document.createElement("span"); wh.className = "when";
          const d = new Date(x.created_at);
          wh.textContent = isNaN(d) ? "" : d.toLocaleDateString();
          rh.append(au, st, wh);
          const cm = document.createElement("p"); cm.textContent = x.comment;
          item.append(rh, cm);

          if (x.id && reviewTokens[x.id]) {
            const eb = document.createElement("button");
            eb.type = "button"; eb.className = "alt small"; eb.textContent = "Edit";
            rh.append(eb);

            const ef = document.createElement("form");
            ef.className = "rform"; ef.hidden = true;
            const esel = makeRatingSelect(x.rating);
            const eta = document.createElement("textarea");
            eta.rows = 3; eta.maxLength = 500; eta.required = true; eta.value = x.comment;
            eta.setAttribute("aria-label", "Edit your review");
            const esave = document.createElement("button");
            esave.type = "submit"; esave.className = "alt"; esave.textContent = "Save changes";
            const ecancel = document.createElement("button");
            ecancel.type = "button"; ecancel.className = "alt"; ecancel.textContent = "Cancel";
            const eerr = document.createElement("p");
            eerr.className = "err"; eerr.setAttribute("role", "alert");
            ef.append(esel, eta, esave, ecancel, eerr);
            item.append(ef);

            eb.addEventListener("click", () => { ef.hidden = !ef.hidden; if (!ef.hidden) eta.focus(); });
            ecancel.addEventListener("click", () => { ef.hidden = true; });
            ef.addEventListener("submit", async ev => {
              ev.preventDefault();
              eerr.textContent = "";
              esave.disabled = true;
              const res = await editReview(x.id, Number(esel.value), eta.value);
              esave.disabled = false;
              if (res === "ok") await loadMods();
              else eerr.textContent = res;
            });
          }
          list.appendChild(item);
        });

        const form = document.createElement("form");
        form.className = "rform";
        form.hidden = !openForms.has(m.id);
        const nm = document.createElement("input");
        nm.type = "text"; nm.placeholder = "Your name"; nm.maxLength = 40; nm.required = true;
        nm.setAttribute("aria-label", "Your name");
        const rate = makeRatingSelect(5);
        const cmt = document.createElement("textarea");
        cmt.rows = 3; cmt.placeholder = "Your review"; cmt.maxLength = 500; cmt.required = true;
        cmt.setAttribute("aria-label", "Your review");
        const sb = document.createElement("button");
        sb.type = "submit"; sb.className = "alt"; sb.textContent = "Post review";
        const er = document.createElement("p");
        er.className = "err"; er.setAttribute("role", "alert");
        form.append(nm, rate, cmt, sb, er);

        vr.addEventListener("click", () => {
          if (openReviews.has(m.id)) openReviews.delete(m.id); else openReviews.add(m.id);
          list.hidden = !openReviews.has(m.id);
        });
        wr.addEventListener("click", () => {
          if (openForms.has(m.id)) openForms.delete(m.id); else openForms.add(m.id);
          form.hidden = !openForms.has(m.id);
          if (!form.hidden) nm.focus();
        });
        form.addEventListener("submit", async ev => {
          ev.preventDefault();
          er.textContent = "";
          sb.disabled = true;
          const res = await postReview(m.id, nm.value, Number(rate.value), cmt.value);
          sb.disabled = false;
          if (res === "ok") {
            openReviews.add(m.id);
            openForms.delete(m.id);
            await loadMods();
          } else {
            er.textContent = res;
          }
        });

        body.append(row, list, form);
      }

      const star = document.createElement("button");
      star.type = "button"; star.className = "star";
      const isFav = favs.has(m.id);
      star.textContent = isFav ? "\u2605" : "\u2606";
      star.setAttribute("aria-pressed", String(isFav));
      star.setAttribute("aria-label", "Favorite " + m.name);
      star.addEventListener("click", () => {
        if (favs.has(m.id)) favs.delete(m.id); else favs.add(m.id);
        saveFavs();
        render();
      });

      card.append(avatar(m.name), body, star);
      feed.appendChild(card);
    });
  }

  function renderCredits() {
    const box = $("credits");
    box.textContent = "";
    credits.forEach(c => {
      const row = document.createElement("article");
      row.className = "person";
      const body = document.createElement("div");
      body.className = "body";
      const head = document.createElement("div"); head.className = "head";
      const n = document.createElement("strong"); n.textContent = c.name;
      head.appendChild(n);
      const r = document.createElement("p"); r.textContent = c.role;
      body.append(head, r);
      row.append(avatar(c.name), body);
      box.appendChild(row);
    });
  }

  function updateCounts() {
    $("c-all").textContent = mods.length || "";
    $("c-working").textContent = mods.filter(m => m.working).length || "";
    $("c-broken").textContent = mods.filter(m => !m.working).length || "";
    $("c-favorites").textContent = mods.filter(m => favs.has(m.id)).length || "";
  }

  function render() {
    const c = channels[current];
    const t = $("title");
    t.textContent = "";
    t.textContent = c.label;

    document.querySelectorAll(".ch").forEach(b => {
      if (b.dataset.ch === current) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });

    $("v-mods").hidden = c.type !== "mods";
    $("v-upload").hidden = c.type !== "upload";
    $("v-credits").hidden = c.type !== "credits";
    $("q").hidden = c.type !== "mods";

    updateCounts();
    if (c.type === "mods") renderMods(c.filter);
    if (c.type === "credits") renderCredits();
  }

  document.querySelectorAll(".ch").forEach(b => b.addEventListener("click", () => {
    current = b.dataset.ch;
    render();
    document.querySelector(".content").scrollTop = 0;
  }));
  $("q").addEventListener("input", render);

  async function loadMods() {
    if (!API || !SUPABASE_KEY) return;
    try {
      const r = await fetch(API + "/rest/v1/mods?select=id,name,working,description,link&order=created_at.desc", { headers: HEADERS });
      if (!r.ok) throw new Error("bad response");
      const data = await r.json();
      mods.length = 0;
      data.forEach(m => mods.push({
        id: String(m.id), name: String(m.name), working: !!m.working,
        description: String(m.description), link: String(m.link)
      }));
      loadFailed = false;
      try {
        const rr = await fetch(API + "/rest/v1/reviews?select=id,mod_id,author,rating,comment,created_at&order=created_at.desc", { headers: HEADERS });
        if (rr.ok) {
          const rd = await rr.json();
          reviews.length = 0;
          rd.forEach(x => reviews.push({
            id: String(x.id), mod_id: String(x.mod_id), author: String(x.author),
            rating: Number(x.rating), comment: String(x.comment), created_at: x.created_at
          }));
        }
      } catch (e) {}
    } catch (e) { loadFailed = true; }
    render();
  }

  $("add").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("err");
    const btn = e.target.querySelector(".save");
    if (!API || !SUPABASE_KEY) { err.textContent = "Uploads aren't set up yet."; return; }
    const link = $("l").value.trim();
    if (!safeUrl(link)) { err.textContent = "Enter a link that starts with http:// or https://."; return; }
    err.textContent = "";
    btn.disabled = true;
    try {
      const r = await fetch(API + "/rest/v1/rpc/add_mod", {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({
          p_password: $("pw").value,
          p_name: $("n").value.trim(),
          p_working: $("w").value === "true",
          p_description: $("d").value.trim(),
          p_link: link
        })
      });
      if (!r.ok) {
        let msg = "";
        try { msg = (await r.json()).message || ""; } catch (x) {}
        err.textContent = msg.includes("wrong password")
          ? "Wrong password. Mod not added."
          : "Couldn't upload. Try again.";
        return;
      }
      e.target.reset();
      await loadMods();
      current = "all";
      render();
    } catch (x) {
      err.textContent = "Couldn't reach the server. Try again.";
    } finally {
      btn.disabled = false;
    }
  });

  // Spin the corner paw every time a button is clicked
  const cornerPaw = $("cornerPaw");
  document.addEventListener("click", e => {
    if (!e.target.closest("button, .dl, .join")) return;
    cornerPaw.classList.remove("spin");
    void cornerPaw.offsetWidth;
    cornerPaw.classList.add("spin");
  });
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const flow = $("pawFlow");
    if (flow) flow.remove();
  }
  cornerPaw.addEventListener("animationend", () => cornerPaw.classList.remove("spin"));

  render();
  loadMods();
</script>
</body>
</html>

<style>
  :root {
    --rail: #f6b3d0;
    --side: #ffd9e8;
    --panel: #ffe3ee;
    --line: #f3b6d0;
    --text: #4a2335;
    --muted: #9a5f7a;
    --yes: #0f8a6f;
    --no: #d93a63;
    --accent: #f2679f;
    --on-accent: #4a1f33;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    line-height: 1.5;
    background: #fff;
  }
  button, input, textarea, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    display: grid;
    grid-template-columns: 72px 240px 1fr;
    height: 100vh; height: 100dvh;
  }
  .app > * { min-height: 0; }

  /* server rail */
  .rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 12px 0; }
  .rail img { width: 48px; height: 48px; border-radius: 16px; display: block; }

  /* channel sidebar */
  .side { background: var(--side); display: flex; flex-direction: column; border-right: 1px solid var(--line); overflow-y: auto; }
  .server {
    display: flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .server .mini { display: none; width: 30px; height: 30px; border-radius: 9px; }
  .server-name {
    margin: 0; font-size: 1.2rem; letter-spacing: -0.01em;
    background: linear-gradient(90deg, #fff7fb, #ffb3d1, #f2679f, #ffb3d1, #fff7fb, #ffb3d1, #f2679f);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 2px rgba(242,103,159,.55)) drop-shadow(0 2px 4px rgba(242,103,159,.3));
    animation: flow 6s linear infinite;
  }
  @keyframes flow { to { background-position: -300% 0; } }
  nav { padding: 12px 8px; }
  .group { margin: 12px 8px 4px; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .group:first-child { margin-top: 0; }
  .ch {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: transparent; border: 0; border-radius: 6px;
    padding: 8px 10px; color: var(--muted); cursor: pointer; text-align: left;
  }
  .ch .count { margin-left: auto; font-size: .8rem; }
  .ch:hover { background: rgba(255,255,255,.55); color: var(--text); }
  .ch[aria-current="page"] { background: rgba(255,255,255,.9); color: var(--text); font-weight: 700; }

  .join {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    background: linear-gradient(90deg, #fff7fb, #ffb3d1, #f2679f, #ffb3d1, #fff7fb, #ffb3d1, #f2679f);
    background-size: 300% 100%;
    animation: flow 6s linear infinite;
    color: var(--on-accent); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px;
    box-shadow: 0 2px 8px rgba(242,103,159,.3);
  }
  .join:hover { box-shadow: 0 2px 12px rgba(242,103,159,.55); }
  .join-side { margin: auto 12px 12px; }
  .join-top { display: none; margin-left: auto; padding: 6px 12px; font-size: .9rem; white-space: nowrap; }

  /* main */
  .main {
    display: flex; flex-direction: column; min-width: 0;
    background-image: linear-gradient(120deg, #ffffff, #ffeef5, #ffffff, #ffe6f0, #ffffff);
    background-size: 300% 300%;
    animation: bgflow 16s ease-in-out infinite;
  }
  @keyframes bgflow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none;
    background: rgba(255,255,255,.7);
  }
  .top h2 { margin: 0; font-size: 1rem; white-space: nowrap; }
  #q {
    width: min(240px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; color: var(--text);
  }
  .content { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  [hidden] { display: none !important; }

  .feed { display: grid; gap: 12px; }
  .msg, .person {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px;
  }
  .av {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700; color: var(--on-accent);
    background: linear-gradient(135deg, #ffb3d1, #f2679f);
  }
  .body { min-width: 0; flex: 1; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .head strong { font-size: 1.05rem; overflow-wrap: anywhere; }
  .status { font-size: .85rem; font-weight: 700; color: var(--no); }
  .status.ok { color: var(--yes); }
  .body p { margin: 4px 0 10px; color: var(--muted); overflow-wrap: anywhere; }
  .person .body p { margin: 0; }
  .dl {
    display: inline-block; background: var(--accent); color: var(--on-accent);
    text-decoration: none; font-weight: 700; border-radius: 8px; padding: 8px 16px;
  }
  .dl[aria-disabled="true"] { background: var(--line); color: var(--muted); pointer-events: none; }
  .empty { color: var(--muted); padding: 24px 0; margin: 0; }

  form { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  input[type=text], input[type=url], input[type=password], textarea, select {
    width: 100%; background: #fff; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 10px 12px;
  }
  .save { justify-self: start; background: var(--yes); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-weight: 700; cursor: pointer; }
  .err { color: var(--no); margin: 0; min-height: 1.2em; }
  .intro { color: var(--muted); margin: 0 0 14px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { display: none; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .server { border-bottom: 0; }
    .server .mini { display: block; }
    .join-side { display: none; }
    .join-top { display: block; }
    nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 8px 8px; }
    .group { display: none; }
    .ch { width: auto; white-space: nowrap; flex: none; }
    #q { width: 140px; }
  }
  @media (prefers-reduced-motion: reduce) { .server-name, .main, .join { animation: none; } }
</style>
</head>

      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = asciiBitLength;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
        (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
    var b = (hash[i] >> (j * 8)) & 255;
    result += (b < 16 ? 0 : '') + b.toString(16);
  }
  return result;
}


  const PASSWORD_HASH = "709e0a383ecf7ce7a261a61c51b2c4770d28c392aece4fc65953fcc2ad53759e";

  // Edit this array to manage the store. Each mod has:
  // WORKING? (true/false), DESCRIPTION, DOWNLOAD LINK
  // Example: { name: "My Mod", working: true, description: "What it does", link: "https://..." }
  const mods = [];

  // Edit this array to change the credits tab.
  const credits = [
    { name: "SL33PYX", role: "Founder of MEOW•WARE" },
    { name: "Slak", role: "Looked cute asf" }
  ];

  const channels = {
    all:     { label: "all mods",    type: "mods", filter: "all" },
    working: { label: "working",     type: "mods", filter: "true" },
    broken:  { label: "not working", type: "mods", filter: "false" },
    upload:  { label: "upload",      type: "upload" },
    credits: { label: "credits",     type: "credits" }
  };
  let current = "all";

  const $ = id => document.getElementById(id);

  function safeUrl(u) {
    try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; }
    catch (e) { return ""; }
  }

  function avatar(name) {
    const a = document.createElement("div");
    a.className = "av";
    a.textContent = (name.trim()[0] || "?").toUpperCase();
    a.setAttribute("aria-hidden", "true");
    return a;
  }

  function renderMods(filter) {
    const feed = $("feed");
    feed.textContent = "";
    const term = $("q").value.trim().toLowerCase();
    const shown = mods.filter(m =>
      (filter === "all" || String(m.working) === filter) &&
      (m.name + " " + m.description).toLowerCase().includes(term));

    if (!shown.length) {
      const e = document.createElement("p");
      e.className = "empty";
      e.textContent = mods.length
        ? "No mods match. Clear the search or pick another tab."
        : "No mods yet. Add one in the upload tab.";
      feed.appendChild(e);
      return;
    }

    shown.forEach(m => {
      const card = document.createElement("article");
      card.className = "msg";

      const body = document.createElement("div");
      body.className = "body";

      const head = document.createElement("div");
      head.className = "head";
      const h = document.createElement("strong"); h.textContent = m.name;
      const s = document.createElement("span");
      s.className = "status" + (m.working ? " ok" : "");
      s.textContent = "WORKING?: " + m.working;
      head.append(h, s);

      const p = document.createElement("p"); p.textContent = m.description;

      const a = document.createElement("a");
      a.className = "dl"; a.textContent = "Download";
      const href = safeUrl(m.link);
      if (href) { a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; }
      else { a.setAttribute("aria-disabled", "true"); }

      body.append(head, p, a);
      card.append(avatar(m.name), body);
      feed.appendChild(card);
    });
  }

  function renderCredits() {
    const box = $("credits");
    box.textContent = "";
    credits.forEach(c => {
      const row = document.createElement("article");
      row.className = "person";
      const body = document.createElement("div");
      body.className = "body";
      const head = document.createElement("div"); head.className = "head";
      const n = document.createElement("strong"); n.textContent = c.name;
      head.appendChild(n);
      const r = document.createElement("p"); r.textContent = c.role;
      body.append(head, r);
      row.append(avatar(c.name), body);
      box.appendChild(row);
    });
  }

  function updateCounts() {
    $("c-all").textContent = mods.length || "";
    $("c-working").textContent = mods.filter(m => m.working).length || "";
    $("c-broken").textContent = mods.filter(m => !m.working).length || "";
  }

  function render() {
    const c = channels[current];
    const t = $("title");
    t.textContent = "";
    t.textContent = c.label;

    document.querySelectorAll(".ch").forEach(b => {
      if (b.dataset.ch === current) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });

    $("v-mods").hidden = c.type !== "mods";
    $("v-upload").hidden = c.type !== "upload";
    $("v-credits").hidden = c.type !== "credits";
    $("q").hidden = c.type !== "mods";

    updateCounts();
    if (c.type === "mods") renderMods(c.filter);
    if (c.type === "credits") renderCredits();
  }

  document.querySelectorAll(".ch").forEach(b => b.addEventListener("click", () => {
    current = b.dataset.ch;
    render();
    document.querySelector(".content").scrollTop = 0;
  }));
  $("q").addEventListener("input", render);

  $("add").addEventListener("submit", e => {
    e.preventDefault();
    const err = $("err");
    if (sha256("meowware|" + $("pw").value) !== PASSWORD_HASH) { err.textContent = "Wrong password. Mod not added."; return; }
    const link = $("l").value.trim();
    if (!safeUrl(link)) { err.textContent = "Enter a link that starts with http:// or https://."; return; }
    err.textContent = "";
    mods.unshift({
      name: $("n").value.trim(),
      working: $("w").value === "true",
      description: $("d").value.trim(),
      link
    });
    e.target.reset();
    current = "all";
    render();
  });

  render();
</script>
</body>
